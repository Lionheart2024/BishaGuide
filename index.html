<style>

label{display:block;font-weight:bold;font-size:13px;margin:0 0 8px}

input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b58a4322}
.filters{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:10px;align-items:end}
button{font: bold 13px Tahoma,Arial;border:0;border-radius:10px;padding:13px 14px;cursor:pointer}
.clear{background:#eee5d7;color:var(--brown)}.export{background:var(--brown);color:#fff7e9}
.summary{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:17px 2px 10px;font-size:13px;color:var(--muted)}
.results{display:grid;gap:9px}.item{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:13px 14px;box-shadow:0 3px 10px #51371908}

<section class="searchbox">
